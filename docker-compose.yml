services:

  postgres:
    image: postgres:16-alpine
    container_name: dreamcart-postgres
    environment:
      POSTGRES_DB: dreamcart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - dreamcart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    container_name: dreamcart-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dreamcart_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      # Uploaded product images are written to /app/uploads/products
      # inside the container. Without this volume they would live only
      # in the container's own filesystem and be lost whenever the
      # container is recreated.
      - dreamcart-uploads:/app/uploads

  frontend:
    build:
      context: ../dreamcart-frontend/dreamcart-frontend
    container_name: dreamcart-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  dreamcart-postgres-data:
  dreamcart-uploads: